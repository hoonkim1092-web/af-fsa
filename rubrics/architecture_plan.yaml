# Rubric: Architecture Plan Quality
# Rulers 패턴 기반 실행 가능한 평가 기준
# 각 차원은 weight, levels(1/3/5점), evidence_check(프로그래매틱 검증) 포함

name: "Architecture Plan Quality"
artifact_types:
  - architecture_plan
  - implementation_plan
  - system_design

dimensions:

  - name: completeness
    description: "모든 deliverable에 owner가 있고, 모든 risk에 대응 전략이 있음"
    weight: 0.25
    levels:
      5: "모든 deliverable에 owner가 명시되고, 모든 risk에 mitigation 전략이 있으며, acceptance_criteria가 최소 3개 이상"
      3: "주요 deliverable에 owner가 있지만 일부 risk 대응이 누락. acceptance_criteria가 1-2개"
      1: "deliverable, risk, acceptance_criteria 중 하나 이상이 대부분 누락"
    evidence_checks:
      - field: "deliverables"
        rule: "all_have_owner"
        description: "모든 deliverable에 owner 필드가 존재해야 함"
      - field: "risks"
        rule: "all_have_mitigation"
        description: "모든 risk에 mitigation 또는 response 필드가 존재해야 함"
      - field: "acceptance_criteria"
        rule: "min_count"
        value: 1
        description: "acceptance_criteria가 최소 1개 이상 존재해야 함"

  - name: evidence_grounding
    description: "핵심 주장이 근거와 연결된 비율"
    weight: 0.20
    levels:
      5: "claim_map의 grounded 비율이 90% 이상"
      3: "grounded 비율이 50-89%"
      1: "grounded 비율이 50% 미만이거나 claim_map이 없음"
    evidence_checks:
      - field: "evidence_summary"
        rule: "min_count"
        value: 2
        description: "evidence_summary가 최소 2개 이상 존재해야 함"
      - field: "_claim_map"
        rule: "grounding_ratio_min"
        value: 0.5
        description: "grounded claims 비율이 50% 이상이어야 함 (claim_map이 없으면 건너뜀)"

  - name: feasibility
    description: "기술 선택에 이유와 대안이 있고, 구현 경로가 구체적"
    weight: 0.20
    levels:
      5: "모든 주요 기술 선택에 rationale과 alternatives가 명시. 구현 단계가 구체적 task 수준으로 분해됨"
      3: "기술 선택은 있지만 대안 분석이 부족하거나, 구현 단계가 추상적"
      1: "기술 선택 이유가 없고, 구현 경로가 불명확"
    evidence_checks:
      - field: "implementation_notes"
        rule: "not_empty"
        description: "implementation_notes 또는 planning_steps가 존재해야 함"
      - field: "required_skills"
        rule: "not_empty"
        description: "required_skills가 하나 이상 명시되어야 함"

  - name: testability
    description: "acceptance criteria가 자동화 가능하거나 관찰 가능한 수준으로 구체적"
    weight: 0.15
    levels:
      5: "모든 acceptance criteria에 verification_method가 명시되거나, 수치/조건으로 표현됨"
      3: "대부분 관찰 가능하지만 일부 추상적 ('잘 동작함', '빠름' 등)"
      1: "대부분 추상적이고 검증 방법이 불명확"
    evidence_checks:
      - field: "acceptance_criteria"
        rule: "not_empty"
        description: "acceptance_criteria가 비어있지 않아야 함"

  - name: consistency
    description: "역할/모듈/태스크 간 모순이 없고, 의존성 그래프에 순환이 없음"
    weight: 0.20
    levels:
      5: "역할-모듈-태스크 매핑이 완전하고, 명백한 모순이나 순환 의존성 없음"
      3: "사소한 불일치 1-2건 존재 (예: 모듈에 owner 없음)"
      1: "명백한 모순이나 역할 매핑 누락이 다수"
    evidence_checks:
      - field: "roles"
        rule: "not_empty"
        description: "roles가 최소 1개 이상 존재해야 함"
      - field: "goal"
        rule: "not_empty"
        description: "goal이 비어있지 않아야 함"

thresholds:
  pass: 4.0              # 가중 평균 4.0 이상
  pass_with_warnings: 3.0 # 가중 평균 3.0-3.9
  fail: 0.0              # 가중 평균 3.0 미만

scoring:
  method: "weighted_average"
  min_score_per_dimension: 1
  max_score_per_dimension: 5
  normalize_to: 1.0     # 최종 점수를 0.0-1.0으로 정규화 (score / 5.0)
