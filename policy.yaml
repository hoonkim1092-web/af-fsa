# Logi-Mind Agent Factory - Universal Single Policy Engine
# 스킬별 리스크 등급 및 모델 라우팅 엔진(engine_id) 정의

engines:
  gemini_flash:
    tier: 1
    description: "Economy/Speed"
  codex:
    tier: 2
    description: "Precision/Code"
  research_pro:
    tier: 3
    description: "Reasoning/Logic"

skills:
  # 데이터 수집 및 관찰 특화
  read_file:
    risk: LOW
    engine_id: gemini_flash
  read_system_info:
    risk: LOW
    engine_id: gemini_flash
    
  # 정밀 조작 및 코드 작성 특화
  write_file:
    risk: HIGH
    engine_id: codex
  delete_file:
    risk: HIGH
    engine_id: codex
  run_command:
    risk: CRITICAL
    engine_id: codex
    
  # 범용 추론 및 기획 특화
  web_search:
    risk: LOW
    engine_id: research_pro
  project_planning:
    risk: MEDIUM
    engine_id: research_pro
    
  # 기타 혼합 스킬
  data_visualize:
    risk: MEDIUM
    engine_id: codex
  issue_tracker:
    risk: LOW
    engine_id: research_pro

  # [Phase 5] IDE 도구 및 외부 MCP 서버 플러그인
  ast_grep:
    risk: LOW
    engine_id: codex
  lsp_hover:
    risk: LOW
    engine_id: codex
  mcp_exa_search:
    risk: MEDIUM
    engine_id: research_pro

# ---------------------------------------------------------------
# 작업 분해 정책 (Task Decomposition Policy)
# ---------------------------------------------------------------
# 에이전트가 프로젝트를 계획할 때 따라야 하는 규칙.
# bootstrap_roles.py 의 LLM 프롬프트에서 이 정책을 참조한다.
task_decomposition:
  roles:
    min: 2
    max: 5
    prefer: "practical_implementation"

  modules:
    independent: true
    max_tasks_per_module: 8
    min_tasks_per_module: 2

  tasks:
    granularity: "small"
    require_verify: true
    naming_convention: "english_snake_case"

  planning_steps:
    min: 3
    max: 5

  required_roles:
    - id: "qa_engineer"
      name: "QA Engineer"
      objective: "핵심 플로우와 회귀 시나리오를 검증한다."
      required_skills: ["integration_test_guard"]

  constraints:
    - "Split work into modules that can be implemented independently."
    - "Every module should have small tasks, not one giant task."
    - "Use explicit dependencies only when needed."
    - "Include at least one verify task overall."
    - "Keep objectives and summaries concrete."
    - "MANDATORY: Always include a qa_engineer role. QA is non-negotiable."
